document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);

        // request spray; past the cap (far above any real page count) new

ackground:#f2f4f3;border-radius:2px\"><\u002Fspan>\n        <span style=\"width:18px;height:2px;background:#f2f4f3;border-radius:2px\"><\u002Fspan>\n        <span style=\"width:18px;height:2px;background:#f2f4f3;border-radius:2px\"><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n  <div style=\"position:fixed;top:72px;left:12px;right:12px;z-index:49;background:rgba(12,14,17,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);display:{{ menuDisplay }}\">\n    <a href=\"#works\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">プロジェクト<\u002Fa>\n    <a href=\"#approach\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">アプローチ<\u002Fa>\n    <a href=\"#profile\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">つくり手<\u002Fa>\n    <a href=\"lp.html\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">LP制作<\u002Fa>\n      <a href=\"motion.html\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">モーション紹介<\u002Fa>\n    <a href=\"https://tedsart.stores.jp/\" target=\"_blank\" rel=\"noopener\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">SHOP（STORES）<\u002Fa>\n    <a href=\"#about\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color:#f2f4f3;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px\" style-hover=\"background:rgba(255,255,255,.06);color:#f2f4f3\">概要<\u002Fa>\n    <a href=\"https://lin.ee/PxVM0IU\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:flex;justify-content:center;background:#06C755;color:#04120c;font-size:15px;font-weight:700;padding:15px 18px;border-radius:12px;margin-top:6px\" style-hover=\"color:#04120c\">LINEで相談する<\u002Fa>\n  <\u002Fdiv>\n\n  <section style=\"position:relative;min-height:92vh;display:flex;align-items:center;padding:150px 28px 100px;overflow:hidden\">\n    <img src=\"56f6a0a4-5578-4597-bb37-e7129f0ab67f\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(rgba(8,9,11,.7), rgba(8,9,11,.56) 55%, #08090b)\"><\u002Fdiv>\n    <canvas id=\"ac-particles\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%\"><\u002Fcanvas>\n    <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 18% 30%, rgba(6,199,85,.12), transparent 70%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1180px;margin:0 auto;width:100%\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.32em;color:#06C755;margin:0 0 30px;animation:ac-pulse 4s ease-in-out infinite\">AI CREATE — PROJECT INDEX / KAGOSHIMA<\u002Fp>\n      <h1 style=\"font-size:clamp(40px,7.4vw,92px);font-weight:900;line-height:1.12;letter-spacing:.01em;margin:0 0 34px;text-wrap:balance;max-width:16em\">つくって、動かして、<br>試している。<\u002Fh1>\n      <p style=\"font-size:clamp(15px,1.8vw,19px);line-height:2.05;color:rgba(242,244,243,.72);margin:0 0 48px;max-width:40em\">生成AIを実務に落とし込むための、11のプロジェクト。LINEの接客AI、AIスタッフによる動画・SNS運用、現場管理ツール、LP制作、ローカルCMのAIアニメ化まで。企画から実装、運用まで一人で手がけています。<\u002Fp>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n        <a href=\"#works\" style=\"display:inline-flex;align-items:center;gap:10px;background:#06C755;color:#04120c;font-weight:700;border-radius:99px;font-size:16px;padding:16px 38px;box-shadow:0 8px 40px rgba(6,199,85,.32)\" style-hover=\"filter:brightness(1.12);transform:translateY(-2px);color:#04120c\">プロジェクトを見る<\u002Fa>\n        <a href=\"https://lin.ee/PxVM0IU\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#f2f4f3;font-weight:500;border-radius:99px;font-size:16px;padding:16px 34px\" style-hover=\"background:rgba(255,255,255,.12);color:#f2f4f3\">LINEで相談する<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:0;margin-top:76px;flex-wrap:wrap\">\n        <div style=\"padding-right:34px\">\n          <div style=\"font-size:30px;font-weight:900\">11<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(242,244,243,.5);margin-top:6px;letter-spacing:.1em\">PROJECTS<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 34px;border-left:1px solid rgba(255,255,255,.12)\">\n          <div style=\"font-size:30px;font-weight:900;color:#06C755\">06<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(242,244,243,.5);margin-top:6px;letter-spacing:.1em\">SHIPPED<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 34px;border-left:1px solid rgba(255,255,255,.12)\">\n          <div style=\"font-size:30px;font-weight:900\">04<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(242,244,243,.5);margin-top:6px;letter-spacing:.1em\">IN DEVELOPMENT<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"works\" style=\"padding:110px 28px;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:20px\">\n        <div>\n          <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:#06C755;margin:0 0 14px\">PROJECTS<\u002Fp>\n          <h2 style=\"font-size:clamp(26px,3.6vw,42px);font-weight:900;margin:0\">11のプロジェクト<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(242,244,243,.4);margin:0;letter-spacing:.1em\">SHIPPED 06 / IN DEV 04 / CONTEST 01<\u002Fp>\n      <\u002Fdiv>\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"10\">\n        <a href=\"{{ p.href }}\" style=\"display:grid;grid-template-columns:74px 1fr auto;gap:clamp(16px,3vw,44px);align-items:center;padding:34px 4px;border-top:1px solid rgba(255,255,255,.09);color:inherit\" style-hover=\"background:rgba(255,255,255,.028);color:inherit\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:rgba(242,244,243,.32)\">{{ p.no }}<\u002Fspan>\n          <div style=\"min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px\">\n              <h3 style=\"font-size:clamp(19px,2.4vw,27px);font-weight:900;margin:0;line-height:1.4\">{{ p.name }}<\u002Fh3>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;border-radius:99px;padding:4px 11px;{{ p.badgeStyle }}\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:14px;line-height:1.95;color:rgba(242,244,243,.62);margin:0;max-width:46em\">{{ p.blurb }}<\u002Fp>\n            <sc-if value=\"{{ p.hasPrice }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14px;font-weight:700;color:#06C755;margin:10px 0 0\">{{ p.price }}<\u002Fp><\u002Fsc-if>\n            <p style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(242,244,243,.38);margin:12px 0 0;letter-spacing:.08em\">{{ p.tags }}<\u002Fp>\n          <\u002Fdiv>\n          <span style=\"font-size:20px;color:#06C755\">→<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n      <div style=\"border-top:1px solid rgba(255,255,255,.09)\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"approach\" style=\"padding:110px 28px;background:#0c0e11;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:#06C755;margin:0 0 14px\">APPROACH<\u002Fp>\n      <h2 style=\"font-size:clamp(26px,3.6vw,42px);font-weight:900;margin:0 0 64px\">つくり方について<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px\">\n        <div style=\"background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:38px 32px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#06C755;margin-bottom:20px;letter-spacing:.12em\">01<\u002Fdiv>\n          <h3 style=\"font-size:18px;font-weight:900;margin:0 0 14px;line-height:1.6\">まず動くものを出す<\u002Fh3>\n          <p style=\"font-size:14px;line-height:2;color:rgba(242,244,243,.65);margin:0\">仕様書より試作。最短1週間で触れるかたちにして、そこから判断します。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:38px 32px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#06C755;margin-bottom:20px;letter-spacing:.12em\">02<\u002Fdiv>\n          <h3 style=\"font-size:18px;font-weight:900;margin:0 0 14px;line-height:1.6\">生成AIを実務に寄せる<\u002Fh3>\n          <p style=\"font-size:14px;line-height:2;color:rgba(242,244,243,.65);margin:0\">デモで終わらせない。現場で毎日使える形まで落とし込むことを前提に設計します。<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:38px 32px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#06C755;margin-bottom:20px;letter-spacing:.12em\">03<\u002Fdiv>\n          <h3 style=\"font-size:18px;font-weight:900;margin:0 0 14px;line-height:1.6\">使いながら育てる<\u002Fh3>\n          <p style=\"font-size:14px;line-height:2;color:rgba(242,244,243,.65);margin:0\">つくったものを実際の業務で使い、そこで分かったことを次の改良に回します。<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"profile\" style=\"padding:110px 28px;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:64px;align-items:start\">\n      <div>\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:#06C755;margin:0 0 14px\">PROFILE<\u002Fp>\n        <h2 style=\"font-size:clamp(26px,3.6vw,42px);font-weight:900;margin:0 0 34px;line-height:1.4\">AIで、もっと面白い<br>未来をつくる。<\u002Fh2>\n        <div style=\"margin:0 0 30px;padding:24px 0;border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)\">\n          <p style=\"font-size:14px;font-weight:700;color:#06C755;margin:0 0 6px;letter-spacing:.04em\">AI Creator<\u002Fp>\n          <p style=\"font-size:clamp(30px,4vw,40px);font-weight:900;margin:0;letter-spacing:.12em;line-height:1.3\">林 ヨシタカ<\u002Fp>\n          <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(242,244,243,.5);margin:6px 0 16px;letter-spacing:.14em\">HayaC Yoshitaka<\u002Fp>\n          <p style=\"font-size:13px;font-weight:700;color:rgba(242,244,243,.85);margin:0;letter-spacing:.12em\">AI <span style=\"color:#06C755\">×<\u002Fspan> WEB <span style=\"color:#06C755\">×<\u002Fspan> VIDEO <span style=\"color:#06C755\">×<\u002Fspan> DESIGN<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px\">\n            <span style=\"font-size:12px;color:rgba(242,244,243,.5)\">コラボレーション<\u002Fspan>\n            <a href=\"https://hayatoproject.com/bokkemonpro/kigurumi/\" target=\"_blank\" rel=\"noopener\" title=\"一般社団法人チェスト連合\" style=\"display:inline-flex;background:#fff;border-radius:8px;padding:6px 10px\" style-hover=\"opacity:.85\"><img src=\"f5047f82-618e-4cb9-aa41-f1e134efc936\" alt=\"一般社団法人チェスト連合\" style=\"height:26px;width:auto;display:block\"><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:15px;line-height:2.1;color:rgba(242,244,243,.7);margin:0\">TEDS ARTのAIクリエイター、林 ヨシタカです。商品企画、撮影や看板の制作、専門学校やスクールでの講師、そして生成AIの実装。分野は変わっても、「自分で考えて、自分の手で形にする」やり方は変わりません。現場の困りごとを知っているから、実際に使われる仕組みがつくれます。<\u002Fp>\n      <\u002Fdiv>\n      <dl style=\"margin:0;border-bottom:1px solid rgba(255,255,255,.09)\">\n        <div style=\"display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(255,255,255,.09)\"><dt style=\"font-weight:900;color:#06C755;font-size:14px\">2000年代初め<\u002Fdt><dd style=\"margin:0;font-size:14.5px;line-height:2;color:rgba(242,244,243,.72)\">iPod/iPad用保護フィルム「BodyMask」を企画。カットデータの作成から試作、パッケージ、発送まで一人で手がけ、Apple Store 渋谷・銀座で販売されました。<\u002Fdd><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(255,255,255,.09)\"><dt style=\"font-weight:900;color:#06C755;font-size:14px\">2004年ごろ〜<\u002Fdt><dd style=\"margin:0;font-size:14.5px;line-height:2;color:rgba(242,244,243,.72)\">ブライダルカメラマンとして、写真や動画を制作。看板のデザインや、マーキングシートの制作・施工も手がけました。<\u002Fdd><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(255,255,255,.09)\"><dt style=\"font-weight:900;color:#06C755;font-size:14px\">講師<\u002Fdt><dd style=\"margin:0;font-size:14.5px;line-height:2;color:rgba(242,244,243,.72)\">デジタルハリウッドSTUDIO鹿児島でトレーナー、<a href=\"https://www.kbcc.ac.jp/\" target=\"_blank\" rel=\"noopener\">鹿児島情報ビジネス公務員専門学校（KBCC）<\u002Fa>でWordPressと動画の講師を務めました。<\u002Fdd><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(255,255,255,.09)\"><dt style=\"font-weight:900;color:#06C755;font-size:14px\">2024年<\u002Fdt><dd style=\"margin:0;font-size:14.5px;line-height:2;color:rgba(242,244,243,.72)\">「鹿児島Digi-1グランプリ2024」アイデア部門に、生成AIで懐かしい鹿児島のローカルCMをアニメとしてよみがえらせる企画「懐かしいローカルCMをAIアニメ化」で応募。応募46件の中から一次審査を通過しました。<a href=\"project.html#local-cm-anime\">（企画の詳細）<\u002Fa><\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"padding:110px 28px;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:64px;align-items:start\">\n      <div>\n        <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:#06C755;margin:0 0 14px\">ABOUT<\u002Fp>\n        <h2 style=\"font-size:clamp(26px,3.6vw,42px);font-weight:900;margin:0 0 26px;line-height:1.4\">鹿児島から、<br>つくり続ける。<\u002Fh2>\n        <p style=\"font-size:15px;line-height:2.1;color:rgba(242,244,243,.7);margin:0\">AI Create は、鹿児島市・天文館を拠点に生成AIの実装に取り組むプロジェクト群です。LP制作を入口に、LINEの接客AI、現場管理、AIアニメ化まで領域を広げています。地元の方には対面で、全国の方にはオンラインで対応します。<\u002Fp>\n      <\u002Fdiv>\n      <dl style=\"display:flex;flex-direction:column;gap:14px;font-size:14px;margin:0\">\n        <div style=\"display:flex;gap:18px\"><dt style=\"color:rgba(242,244,243,.45);flex:none;width:76px\">屋号<\u002Fdt><dd style=\"margin:0;font-weight:700\">AI Create（TEDS ART）<\u002Fdd><\u002Fdiv>\n        <div style=\"display:flex;gap:18px\"><dt style=\"color:rgba(242,244,243,.45);flex:none;width:76px\">所在地<\u002Fdt><dd style=\"margin:0\">鹿児島県鹿児島市（天文館テンパーク近く）<\u002Fdd><\u002Fdiv>\n        <div style=\"display:flex;gap:18px\"><dt style=\"color:rgba(242,244,243,.45);flex:none;width:76px\">領域<\u002Fdt><dd style=\"margin:0\">AIエージェント／業務ツール／LP制作／Webサイト制作<\u002Fdd><\u002Fdiv>\n        <div style=\"display:flex;gap:18px\"><dt style=\"color:rgba(242,244,243,.45);flex:none;width:76px\">お問合せ<\u002Fdt><dd style=\"margin:0\"><a href=\"https://lin.ee/PxVM0IU\" target=\"_blank\" rel=\"noopener\">LINE公式アカウント<\u002Fa><\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;padding:130px 28px;text-align:center;overflow:hidden;border-top:1px solid rgba(255,255,255,.07)\">\n    <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 100%, rgba(6,199,85,.14), transparent 70%)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:760px;margin:0 auto\">\n      <h2 style=\"font-size:clamp(26px,4.2vw,46px);font-weight:900;line-height:1.42;margin:0 0 22px;text-wrap:balance\">つくりたいものが、<br>すでにあるなら。<\u002Fh2>\n      <p style=\"font-size:15px;line-height:2;color:rgba(242,244,243,.65);margin:0 0 44px\">相談・お見積りは無料です。LINEで気軽にメッセージをお送りください。<\u002Fp>\n      <a href=\"https://lin.ee/PxVM0IU\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:10px;background:#06C755;color:#04120c;font-weight:700;border-radius:99px;font-size:17px;padding:18px 48px;box-shadow:0 8px 48px rgba(6,199,85,.4)\" style-hover=\"filter:brightness(1.12);transform:translateY(-2px);color:#04120c\">LINEで相談する<\u002Fa>\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(242,244,243,.4);margin:26px 0 0\">lin.ee/PxVM0IU — 返信は原則24時間以内<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:36px 28px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <a href=\"index.html\" style=\"display:block\"><img src=\"303c3856-116e-452e-8055-9b12da4a4d5e\" alt=\"TEDS ART\" style=\"height:18px;width:auto;display:block\"><\u002Fa>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(242,244,243,.4)\">鹿児島市・天文館<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-size:11.5px;color:rgba(242,244,243,.4)\">© 2026 TEDS ART. All rights reserved.<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { menuOpen: false };\n\n  componentDidMount() { this.startParticles(); }\n  componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); if (this._onResize) window.removeEventListener('resize', this._onResize); }\n  startParticles() {\n    const canvas = document.getElementById('ac-particles');\n    if (!canvas) { this._tries = (this._tries || 0) + 1; if (this._tries < 40) setTimeout(() => this.startParticles(), 100); return; }\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const ctx = canvas.getContext('2d');\n    const dpr = window.devicePixelRatio || 1;\n    let w, h, dots;\n    const init = () => {\n      w = canvas.width = canvas.offsetWidth * dpr;\n      h = canvas.height = canvas.offsetHeight * dpr;\n      const n = Math.min(90, Math.floor(canvas.offsetWidth / 14));\n      dots = Array.from({ length: n }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - .5) * .28 * dpr, vy: (Math.random() - .5) * .28 * dpr,\n        r: (Math.random() * 1.4 + .5) * dpr\n      }));\n    };\n    init();\n    this._onResize = init;\n    window.addEventListener('resize', this._onResize);\n    const linkDist = 130 * dpr;\n    const tick = () => {\n      if (!canvas.isConnected) { this._raf = null; return; }\n      ctx.clearRect(0, 0, w, h);\n      for (const d of dots) {\n        d.x += d.vx; d.y += d.vy;\n        if (d.x < 0 || d.x > w) d.vx *= -1;\n        if (d.y < 0 || d.y > h) d.vy *= -1;\n      }\n      ctx.lineWidth = dpr * .5;\n      for (let i = 0; i < dots.length; i++) {\n        for (let j = i + 1; j < dots.length; j++) {\n          const dist = Math.hypot(dots[i].x - dots[j].x, dots[i].y - dots[j].y);\n          if (dist < linkDist) {\n            ctx.strokeStyle = 'rgba(120,220,175,' + (0.13 * (1 - dist / linkDist)).toFixed(3) + ')';\n            ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();\n          }\n        }\n      }\n      ctx.fillStyle = 'rgba(150,235,195,.5)';\n      for (const d of dots) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n  renderVals() {\n    const shipped = 'background:rgba(6,199,85,.14);border:1px solid rgba(6,199,85,.4);color:#06C755';\n    const dev = 'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);color:rgba(242,244,243,.6)';\n    const raw = [\n      ['LINE × AI 自動集客システム', '公開中', '公式LINEで24時間はたらくAI秘書「エルちゃん」。問い合わせへの自動応答から予約案内・申込みまでを、LINEの中だけで完結させます。', 'AI AGENT / LINE / MARKETING', 'ai-agent-line', '料金 49,800円〜（マニュアル版）'],\n      ['AIスタッフ × 動画・SNS自動投稿', '公開中', 'Claude Codeの「AIスタッフ」が、縦動画の編集からYouTube・Instagram・TikTokなどへの予約投稿までを分担。導入サポートのモニターを先着5名で募集中。', 'AI AGENT / VIDEO / SNS', 'ai-staff-sns', '料金 29,800円〜（マニュアル版）／モニター 39,800円'],\n      ['Crew Manager', '公開中', 'LINE上で出演依頼から出演確定までを完結させる、現場スタッフの稼働管理ツール。', 'LINE / SCHEDULING / OPERATIONS', 'crew-manager'],\n      ['モバイルオーダー機能', '公開中', 'スマホから注文まで完結させる仕組み。店舗の導線に合わせて組み込み可能。', 'WEB APP / ORDERING', 'mobile-order'],\n      ['生成AIで実現する、爆速・格安のLP制作', '公開中', '生成AIを使い、最短1週間でサンプル2案。15,000円（先着10件限定）のデータ納品買い切り型。', 'LP / HTML・CSS・JS', 'lp'],\n      ['割引通知アプリ', '開発中', '近くの割引情報を受け取るアプリ。通知の設計を検証中。', 'MOBILE / NOTIFICATION', 'discount-notify'],\n      ['桜島爆発速報所', '公開中', '「今日、桜島は吼えるか。」桜島の爆発を速報する、鹿児島ローカル発のWebサービス。Instagramでも毎日発信中。', 'SAKURAJIMA BOOM METER / LOCAL', 'sakurajima'],\n      ['GPS ART', '開発中', 'AI教官が曲がり角を声で指示するGPSアート・ナビ。何を描いているかは完成するまで秘密。', 'GPS / VOICE NAVIGATION / AI', 'gps-art'],\n      ['試験運営サポートAI', '開発中', '試験中に届く「これは大丈夫？」という判断の質問に、LINEでAIがすぐ答える仕組み。', 'AI AGENT / LINE / OPERATIONS', 'exam-support'],\n      ['シフト自動作成', '開発中', 'スタッフが出られない日をスマホで入力すると、条件に合わせてシフトを自動で組むツール。', 'WEB APP / SCHEDULING', 'shift-maker'],\n      ['ローカルCMのAIアニメ化', '一次審査通過', '懐かしい鹿児島のローカルCMを、生成AIでアニメとしてよみがえらせる企画。Digi-1グランプリ2024で一次審査を通過。', 'GENERATIVE AI / VIDEO / CONTEST', 'local-cm-anime']\n    ];\n    return {\n      menuDisplay: this.state.menuOpen ? 'flex' : 'none',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      projects: raw.map((r, i) => ({\n        no: String(i + 1).padStart(2, '0'),\n        name: r[0], status: r[1], blurb: r[2], tags: r[3], price: r[5] || '', hasPrice: !!r[5],\n        badgeStyle: r[1] === '公開中' ? shipped : dev,\n        href: r[4] === 'lp' ? 'lp.html' : 'project.html#' + r[4]\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
