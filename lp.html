    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an

50%, rgba(8,9,11,.82))\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1080px;margin:0 auto\">\n    <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:var(--ta-accent,#06C755);margin:0 0 14px;text-align:center\" data-reveal=\"\">PROCESS<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,3.6vw,40px);font-weight:900;text-align:center;margin:0 0 72px\" data-reveal=\"\">公開までの流れ<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n        <div data-reveal=\"\" style=\"position:relative;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:28px 22px;text-align:center\">\n          <div style=\"width:34px;height:34px;border-radius:50%;background:var(--ta-accent,#06C755);color:#04120c;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px\">{{ st.n }}<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:700;margin-bottom:8px\">{{ st.title }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:rgba(242,244,243,.55);line-height:1.8\">{{ st.body }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:120px 24px;background:#0c0e11;border-top:1px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:760px;margin:0 auto\">\n    <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:var(--ta-accent,#06C755);margin:0 0 14px;text-align:center\" data-reveal=\"\">FAQ<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,3.6vw,40px);font-weight:900;text-align:center;margin:0 0 56px\" data-reveal=\"\">よくあるご質問<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <sc-for list=\"{{ faqs }}\" as -reveal=\"\">\n      <p style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.28em;color:var(--ta-accent,#06C755);margin:0 0 14px\">OFFICE<\u002Fp>\n      <h2 style=\"font-size:clamp(26px,3.6vw,40px);font-weight:900;margin:0 0 24px\">鹿児島から、全国へ。<\u002Fh2>\n      <p style=\"font-size:15px;line-height:2.1;color:rgba(242,244,243,.7);margin:0 0 32px\">TEDS ART は鹿児島市・天文館（テンパーク近く）を拠点とする、LP（ランディングページ）専門の制作事務所です。地元の方には対面でのヒアリングも可能。全国のお客様にはオンラインで、同じスピードと品質をお届けします。<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:14px\">\n        <div style=\"display:flex;gap:16px\"><span style=\"color:rgba(242,244,243,.45);flex:none;width:64px\">屋号<\u002Fspan><span style=\"font-weight:700\">TEDS ART<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"color:rgba(242,244,243,.45);flex:none;width:64px\">所在地<\u002Fspan><span>鹿児島県鹿児島市（天文館テンパーク近く）<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"color:rgba(242,244,243,.45);flex:none;width:64px\">事業内容<\u002Fspan><span>LP（ランディングページ）専門制作／公開代行／ドメイン・サーバー取得代行<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"color:rgba(242,244,243,.45);flex:none;width:64px\">お問合せ<\u002Fspan><a href=\"https://lin.ee/66mNp1W\" target=\"_blank\">LINE公式アカウント<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"animation:ta-drift 7s ease-in-out infinite\">\n      <img src=\"eb4604d4-0060-450f-87fa-1b9d793f157d\" alt=\"天文館周辺の街並み\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:1px solid rgba(255,255,255,.1);display:block\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ クロージングCTA ============ -->\n<section data-screen-label=\"クロージングCTA\" style=\"position:relative;padding:140px 24px;text-align:center;overflow:hidden;border-top:1px solid rgba(255,255,255,.07)\">\n  <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 100%, rgba(6,199,85,.14), transparent 70%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:760px;margin:0 auto\" data-reveal=\"\">\n    <h2 style=\"font-size:clamp(28px,4.4vw,48px);font-weight:900;line-height:1.4;margin:0 0 24px;text-wrap:balance\">まずは、無料相談から。<br>1週間後、2つの答えをお見せします。<\u002Fh2>\n    <p style=\"font-size:15px;line-height:2;color:rgba(242,244,243,.65);margin:0 0 44px\">ご相談・お見積りは無料です。LINEで気軽にメッセージをお送りください。<\u002Fp>\n    <a href=\"https://lin.ee/66mNp1W\" target=\"_blank\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--ta-accent,#06C755);color:#04120c;font-weight:700;font-size:17px;padding:18px 48px;border-radius:99px;box-shadow:0 8px 48px rgba(6,199,85,.4)\" style-hover=\"filter:brightness(1.12);transform:translateY(-2px)\">LINEで無料相談する<\u002Fa>\n    <p style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(242,244,243,.4);margin:26px 0 0\">lin.ee/66mNp1W — 返信は原則24時間以内<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer data-screen-label=\"Footer\" style=\"padding:36px 28px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px\">\n  <div style=\"display:flex;align-items:center;gap:12px\">\n    <img src=\"303c3856-116e-452e-8055-9b12da4a4d5e\" alt=\"TEDS ART\" style=\"height:18px;width:auto;display:block\">\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(242,244,243,.4)\">鹿児島市・天文館<\u002Fspan>\n  <\u002Fdiv>\n  <nav style=\"display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;white-space:nowrap\"><a href=\"index.html\" style=\"color:rgba(242,244,243,.6)\">トップページ<\u002Fa><a href=\"index.html#works\" style=\"color:rgba(242,244,243,.6)\">制作実績<\u002Fa><a href=\"index.html#profile\" style=\"color:rgba(242,244,243,.6)\">つくり手<\u002Fa><a href=\"tokushoho.html\" style=\"color:rgba(242,244,243,.6)\">特定商取引法に基づく表記<\u002Fa><\u002Fnav>\n  <span style=\"font-size:11.5px;color:rgba(242,244,243,.4)\">© 2026 TEDS ART. All rights reserved.<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#06C755&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#06C755&quot;, &quot;#19c37d&quot;, &quot;#3b82f6&quot;, &quot;#a78bfa&quot;], &quot;section&quot;: &quot;テーマ&quot;}, &quot;heroMotion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;テーマ&quot;}}\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, isMobile: false, menuOpen: false };\n  canvasRef = React.createRef();\n\n  componentDidMount() {\n    this._mql = window.matchMedia('(max-width: 680px)');\n    this._onMql = () => this.setState({ isMobile: this._mql.matches, menuOpen: false });\n    this._mql.addEventListener('change', this._onMql);\n    this._onMql();\n    this.applyAccent();\n    this.setupReveal();\n    this.setupParticles();\n  }\n  componentDidUpdate() {\n    this.applyAccent();\n    if ((this.props.heroMotion ?? true) && !this._raf) this.setupParticles();\n    if (!(this.props.heroMotion ?? true) && this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }\n  }\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._obs) this._obs.disconnect();\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    if (this._mql) this._mql.removeEventListener('change', this._onMql);\n  }\n\n  applyAccent() {\n    document.documentElement.style.setProperty('--ta-accent', this.props.accent ?? '#06C755');\n  }\n\n  setupReveal() {\n    const els = document.querySelectorAll('[data-reveal]');\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(26px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.2,.6,.2,1), transform .8s cubic-bezier(.2,.6,.2,1)';\n    });\n    this._obs = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'translateY(0)';\n          this._obs.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12 });\n    els.forEach(el => this._obs.observe(el));\n  }\n\n  setupParticles() {\n    const canvas = this.canvasRef.current;\n    if (!canvas || !(this.props.heroMotion ?? true)) return;\n    const ctx = canvas.getContext('2d');\n    let w, h, dots;\n    const init = () => {\n      w = canvas.width = canvas.offsetWidth * devicePixelRatio;\n      h = canvas.height = canvas.offsetHeight * devicePixelRatio;\n      const n = Math.min(90, Math.floor(canvas.offsetWidth / 14));\n      dots = Array.from({ length: n }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - .5) * .28 * devicePixelRatio,\n        vy: (Math.random() - .5) * .28 * devicePixelRatio,\n        r: (Math.random() * 1.4 + .5) * devicePixelRatio\n      }));\n    };\n    init();\n    this._onResize = init;\n    window.addEventListener('resize', this._onResize);\n    const linkDist = 130 * devicePixelRatio;\n    const tick = () => {\n      if (!this.canvasRef.current) { this._raf = null; return; }\n      ctx.clearRect(0, 0, w, h);\n      for (const d of dots) {\n        d.x += d.vx; d.y += d.vy;\n        if (d.x < 0 || d.x > w) d.vx *= -1;\n        if (d.y < 0 || d.y > h) d.vy *= -1;\n      }\n      ctx.lineWidth = devicePixelRatio * .5;\n      for (let i = 0; i < dots.length; i++) {\n        for (let j = i + 1; j < dots.length; j++) {\n          const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;\n          const dist = Math.hypot(dx, dy);\n          if (dist < linkDist) {\n            ctx.strokeStyle = 'rgba(120,220,175,' + (0.13 * (1 - dist / linkDist)).toFixed(3) + ')';\n            ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();\n          }\n        }\n      }\n      ctx.fillStyle = 'rgba(150,235,195,.5)';\n      for (const d of dots) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  renderVals() {\n    const openFaq = this.state.openFaq;\n    const faqsData = [\n      { q: '15,000円の基本プランには何が含まれますか？', a: 'LPのデータ一式（HTML / CSS / JS）の納品です。サーバーへの反映やドメイン設定は、お客様ご自身で行っていただくか、オプションをご利用ください。' },\n      { q: '事前に用意するものはありますか？', a: 'LPに載せる原稿（ヒアリングシートをご用意します）と、メイン画像1枚＋その他の画像2枚程度をご用意ください。' },\n      { q: '画像が足りない場合はどうなりますか？', a: 'イメージをお伝えいただければ、商用利用できるフリー素材を手配します（1枚500円）。' },\n      { q: 'サーバーやドメインを持っていません。', a: 'ドメイン＆サーバーの取得代行（5,000円）と公開代行（2,000円）をご利用いただけます。サーバー・ドメインの契約費用は別途実費となります。' },\n      { q: '制作途中で内容を変えられますか？', a: '修正対応の範囲で調整します。制作開始後の大幅なデザイン・構成の変更は、追加料金をいただく場合があります。' },\n      { q: '制作をお断りするジャンルはありますか？', a: '公序良俗に反するサイト、アダルト、詐欺的な商材など、当方が不適切と判断したジャンルはお断りする場合があります。' },\n      { q: '鹿児島県外からでも依頼できますか？', a: 'はい。ヒアリングから納品までオンラインで完結できますので、全国どこからでもご依頼いただけます。' }\n    ];\n    return {\n      showNavLinks: !this.state.isMobile,\n      showHamburger: this.state.isMobile,\n      menuOpen: this.state.isMobile && this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      heroMotion: this.props.heroMotion ?? true,\n      canvasRef: this.canvasRef,\n      problems: [\n        { num: '01', text: 'LP（ランディングページ）を作りたいが、初期費用が高くて踏み出せない' },\n        { num: '02', text: '画像素材がなくて困っている' },\n        { num: '03', text: '早く公開してテストを行いたい' }\n      ],\n      strengths: [\n        { num: '01', title: '実績作りの15,000円特別価格', body: '月額縛りなし。HTML / CSS / JSのデータ一式を15,000円で納品します。必要なオプションだけを組み合わせられます。' },\n        { num:
